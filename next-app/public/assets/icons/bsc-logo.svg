  </defs>
  <circle cx="24" cy="24" r="22" fill="url(#bsc-bg)" stroke="url(#bsc-gold)" stroke-width="2" />
  <!-- School / Science Emblem -->
  <!-- Atom orbit / Science crest -->
  <ellipse cx="24" cy="20" rx="10" ry="4.5" fill="none" stroke="url(#bsc-gold)" stroke-width="1.5" transform="rotate(30 24 20)" />
  <ellipse cx="24" cy="20" rx="10" ry="4.5" fill="none" stroke="url(#bsc-gold)" stroke-width="1.5" transform="rotate(-30 24 20)" />
  <circle cx="24" cy="20" r="2.5" fill="url(#bsc-gold)" />
  <!-- BSC Text -->
